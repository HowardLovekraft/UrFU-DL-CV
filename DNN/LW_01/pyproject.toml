[project]
name = "lw-01"
version = "0.1.0"
description = "Лабораторная работа №1 по предмету 'Программирование глубоких нейронных сетей'"
readme = "README.md"
authors = [
    { name = "HowardLovekraft", email = "117375241+HowardLovekraft@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "jupyter>=1.1.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "matplotlib>=3.11.2",
    "torchcodec>=0.17.0",
    "mlflow>=3.18.0",
]

[tool.uv.sources]
torch = [
	{ index = "pytorch-cpu" },
]
torchvision = [
	{ index = "pytorch-cpu" },
]
torchcodec = [
	{ index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
